name: Build Windows EXE

on:
  push:
    branches:
      - main
      - fix/windows-hotkey-1.0.7
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar EXE
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name BarraInteractiva --add-data "assets;assets" app.py

      - name: Renombrar versión
        shell: powershell
        run: |
          Copy-Item "dist\BarraInteractiva.exe" "BarraInteractiva_1.0.7_Windows.exe"

      - name: Subir EXE
        uses: actions/upload-artifact@v4
        with:
          name: barra-interactiva-windows-1.0.7
          path: BarraInteractiva_1.0.7_Windows.exe
          if-no-files-found: error
