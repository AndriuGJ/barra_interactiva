name: Build DEB

on:
  push:
    branches:
      - main
      - fix/captura-1.0.3
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Construir paquete DEB
        run: |
          chmod +x build_deb.sh
          VERSION=1.0.3 ARCH=amd64 ./build_deb.sh

      - name: Subir paquete
        uses: actions/upload-artifact@v4
        with:
          name: barra-interactiva-deb-1.0.3
          path: barra-interactiva_1.0.3_amd64.deb
          if-no-files-found: error
