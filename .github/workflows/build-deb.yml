name: Build DEB

on:
  push:
    branches:
      - main
      - fix/captura-posicion-1.0.4
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependencias de construcción
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Construir paquete DEB
        run: |
          chmod +x build_deb.sh
          VERSION=1.0.4 ARCH=amd64 ./build_deb.sh

      - name: Subir paquete
        uses: actions/upload-artifact@v4
        with:
          name: barra-interactiva-deb-1.0.4
          path: barra-interactiva_1.0.4_amd64.deb
          if-no-files-found: error
